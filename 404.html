<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 — Página não encontrada | Weslley 3Dezão</title>
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: dark; background: #090909; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 40px 20px; font-family: Arial, Helvetica, sans-serif; color: #f5f5f5; }
    main { width: 100%; max-width: 650px; text-align: center; }
    .code { margin: 0 0 40px; font-size: clamp(112px, 23vw, 180px); font-weight: 900; line-height: 1; letter-spacing: -0.055em; color: #6863ed; text-shadow: -4px 0 #f04e50, 4px 0 #00b9cb; }
    h1 { margin: 0 0 14px; font-size: clamp(20px, 3vw, 24px); line-height: 1.3; }
    .description { max-width: 410px; margin: 0 auto 20px; color: #aaa; font-size: 14px; line-height: 1.6; }
    nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .button { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; min-width: 106px; padding: 10px 20px; border: 1px solid #303030; border-radius: 7px; background: #181818; color: #fff; font-size: 14px; font-weight: 700; text-decoration: none; }
    .home { background: #6863ed; border-color: #817df5; color: #080812; }
    .button:hover { border-color: #aaa; }
    .button:focus-visible { outline: 3px solid #fff; outline-offset: 5px; }
    @media (max-height: 480px) { body { padding-block: 24px; } .code { font-size: 100px; margin-bottom: 20px; } }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>404 — Página não encontrada</h1>
    <p class="description">O endereço que você procura não está disponível ou foi alterado.</p>
    <nav aria-label="Navegação de recuperação">
      <a class="button" id="back" href="/weslley-3dezao-render-3d/">Voltar</a>
      <a class="button home" id="home" href="/weslley-3dezao-render-3d/">Ir para Home</a>
    </nav>
  </main>
  <script>
    (() => {
      const base = '/weslley-3dezao-render-3d/';
      const local = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
      const home = local && !location.pathname.startsWith(base) ? '/' : base;
      const back = document.getElementById('back');
      back.href = home;
      document.getElementById('home').href = home;
      let previous;
      try { previous = new URL(document.referrer); } catch { return; }
      // Only return to a known site page; history length alone cannot validate a destination.
      const pages = new Set([home, home + 'index.html', home + 'servicos.html', home + 'contato.html']);
      if (history.length > 1 && previous.origin === location.origin && pages.has(previous.pathname) && previous.href !== location.href) {
        back.addEventListener('click', event => {
          if (event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
          event.preventDefault();
          history.back();
        });
      }
    })();
  </script>
</body>
</html>
